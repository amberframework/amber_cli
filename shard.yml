name: amber_cli
version: 2.0.16

authors:
  - crimson-knight <crimsonknightstudios@gmail.com>

crystal: ">= 1.20.0, < 2.0"

license: MIT

targets:
  amber:
    main: src/amber_cli.cr
  amber-lsp:
    main: src/amber_lsp.cr

dependencies:

  # Stable static-asset compiler used by the CLI and generated applications.
  asset_pipeline:
    github: amberframework/asset_pipeline
    version: 0.40.0

  grant:
    github: crimson-knight/grant
    # `amber database` runs migrations on Grant: its own PostgreSQL driver on
    # Beryl TLS 1.3 and its own SQLite engine, so the CLI links no C library.
    commit: 05d0ed6403b45763a9c3c346c6284a235ec8821d

  # The MySQL driver generated MySQL applications use (0.18.0, TLS 1.3 and the
  # password exchanges on Beryl).
  mysql:
    github: crimson-knight/crystal-mysql
    commit: 12169921c2920494caa4421f9b412838b4bb5195

  # Pure-Crystal cryptography (AES-CBC, HMAC) for `amber encrypt`, so the CLI
  # links no OpenSSL. The same commit crystal-mysql pins.
  beryl:
    github: amberframework/beryl
    commit: ed5f21e7ddc3e30750abdd4c944ee22d16b12d57

  exception_page:
    github: crystal-loot/exception_page
    version: 0.2.2

  # CLI tool item, specifically for when distributing a compiled binary (like the CLI tool will be)
  compiled_license:
    github: elorest/compiled_license
    version: 1.2.2

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    # Includes upstream Crystal 1.21+ compatibility pending Ameba 1.7.0.
    commit: cdd58b34b0d8a9c785d67183a7a8f07541549e55
