name: amber_cli
version: 2.0.5

authors:
  - crimson-knight <crimsonknightstudios@gmail.com>

crystal: ">= 1.20.0, < 2.0"

license: MIT

targets:
  amber:
    main: src/amber_cli.cr
  amber-lsp:
    main: src/amber_lsp.cr

dependencies:

  # Stable static-asset compiler used by the CLI and generated applications.
  asset_pipeline:
    github: amberframework/asset_pipeline
    version: ~> 0.37.0

  micrate:
    github: amberframework/micrate
    commit: 56afd5607cc591776980f3d3762495c037b98d98

  pg:
    github: will/crystal-pg
    version: ~> 0.29.0

  mysql:
    github: crystal-lang/crystal-mysql
    version: ~> 0.16.0

  sqlite3:
    github: crystal-lang/crystal-sqlite3
    version: ~> 0.21.0

  exception_page:
    github: crystal-loot/exception_page
    version: ~> 0.2.1

  # CLI tool item, specifically for when distributing a compiled binary (like the CLI tool will be)
  compiled_license:
    github: elorest/compiled_license
    version: ~> 1.2.2

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    # Includes upstream Crystal 1.21+ compatibility pending Ameba 1.7.0.
    commit: cdd58b34b0d8a9c785d67183a7a8f07541549e55
