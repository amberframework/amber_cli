name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          - target: linux-x86_64
            os: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Crystal (Linux)
      if: matrix.target == 'linux-x86_64'
      uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
      with:
        crystal: latest

    - name: Install Crystal and OpenSSL (macOS)
      if: matrix.target == 'darwin-arm64'
      run: brew install crystal openssl@3
    
    - name: Cache shards
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/shards
          ./lib
        key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
        restore-keys: |
          ${{ runner.os }}-shards-
    
    - name: Install dependencies
      run: shards install
    
    - name: Build LSP binary for integration specs
      run: |
        mkdir -p bin
        crystal build src/amber_lsp.cr --no-debug -o bin/amber-lsp

    - name: Run tests
      run: crystal spec
    
    - name: Build binaries (Linux)
      if: matrix.target == 'linux-x86_64'
      run: |
        crystal build src/amber_cli.cr -o amber --release --static
        crystal build src/amber_lsp.cr -o amber-lsp --release --static

    - name: Build binaries (macOS)
      if: matrix.target == 'darwin-arm64'
      run: |
        crystal build src/amber_cli.cr -o amber --release
        crystal build src/amber_lsp.cr -o amber-lsp --release

    - name: Test binaries
      run: |
        ./amber --version
        ./amber
        ./amber new --help
        ./amber-lsp --help

    - name: Reject retired OpenSSL linkage (macOS)
      if: matrix.target == 'darwin-arm64'
      run: |
        otool -L amber
        otool -L amber-lsp
        ! otool -L amber amber-lsp | grep -F 'openssl@1.1'

    - name: Smoke test generated Amber V2 web app
      # Exercise the exact framework and asset releases emitted by the template.
      run: scripts/smoke_generated_web.sh ./amber

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: github.event_name == 'workflow_dispatch'
      with:
        name: amber-cli-${{ matrix.target }}-build
        path: |
          amber
          amber-lsp
        retention-days: 7 
