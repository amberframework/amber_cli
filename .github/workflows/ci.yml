name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        crystal: [latest]

    name: Test on ${{ matrix.os }} with Crystal ${{ matrix.crystal }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Refresh apt package index
      # install-crystal runs apt-get install without an update, so a stale
      # runner image index 404s on superseded packages.
      if: runner.os == 'Linux'
      run: sudo apt-get update

    - name: Install Crystal
      if: runner.os == 'Linux'
      uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
      with:
        crystal: ${{ matrix.crystal }}

    - name: Install Crystal with Homebrew
      # Homebrew's Crystal brings llvm-config, which the API lookup specs need to
      # build the standard library docs; the install-crystal macOS tarball has none.
      if: runner.os == 'macOS'
      run: brew install crystal

    - name: Cache shards
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/shards
        key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
        restore-keys: |
          ${{ runner.os }}-shards-

    - name: Build pinned Minecart
      run: scripts/install_pinned_minecart.sh

    - name: Install dependencies
      run: minecart install --frozen --skip-ai-docs

    - name: Check Amber V2 beta contract
      run: scripts/check_beta_contract.sh

    - name: Check code formatting
      run: crystal tool format --check src spec

    - name: Run code climate checks
      run: ./bin/ameba src/amber_cli/native src/amber_lsp
      continue-on-error: true

    - name: Compile CLI
      run: crystal build src/amber_cli.cr --no-debug -o amber

    - name: Compile LSP
      run: crystal build src/amber_lsp.cr --no-debug -o amber-lsp

    - name: Build LSP binary for integration specs
      run: |
        mkdir -p bin
        crystal build src/amber_lsp.cr --no-debug -o bin/amber-lsp

    - name: Run tests
      run: crystal spec

    - name: Build release binaries
      if: matrix.os == 'ubuntu-24.04'
      run: |
        crystal build src/amber_cli.cr --release --no-debug -o amber_cli
        crystal build src/amber_lsp.cr --release --no-debug -o amber_lsp

    - name: Upload binary artifacts (Linux)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: matrix.os == 'ubuntu-24.04'
      with:
        name: amber-cli-linux
        path: |
          amber_cli
          amber_lsp

  # crystal-alpha's default Regex engine is Mica, which leaves out lookaround,
  # backreferences, atomic groups and possessive quantifiers; a literal that
  # uses one stops the build of every app that reaches it. This job checks
  # every regex in the CLI's own source, and in the code `amber new` and
  # every `amber generate` type write, against Mica's dialect. The checker
  # comes from amberframework/mica at a pinned commit, verified by its Git
  # tree (scripts/check_regex_on_mica.sh).
  regex-on-mica:
    runs-on: ubuntu-24.04
    name: Every regex runs on Mica
    env:
      CRYSTAL_VERSION: 1.22.1
      CRYSTAL_TARBALL: crystal-1.22.1-1-linux-x86_64-bundled.tar.gz
      CRYSTAL_SHA256: 8fe554e47ca8c669694956ad8b0fe5847a3304f154e7b52cbd49f5a9deac794d

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Install build libraries
      # The libraries install-crystal adds on Linux; the CLI links libyaml,
      # libssl and libsqlite3.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgmp-dev libssl-dev libxml2-dev libyaml-dev libz-dev libsqlite3-dev

    - name: Install Crystal 1.22.1 (sha256-verified)
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/$CRYSTAL_TARBALL"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/crystal-lang/crystal/releases/download/$CRYSTAL_VERSION/$CRYSTAL_TARBALL"
        echo "$CRYSTAL_SHA256  $archive" | shasum -a 256 -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/crystal-$CRYSTAL_VERSION-1/bin" >> "$GITHUB_PATH"

    - name: Build pinned Minecart
      run: scripts/install_pinned_minecart.sh

    - name: Install dependencies
      run: minecart install --frozen --skip-ai-docs

    - name: Check every regex in the CLI against Mica's dialect
      env:
        CRYSTAL: crystal
      run: scripts/check_regex_on_mica.sh

    - name: Compile CLI
      run: crystal build src/amber_cli.cr --no-debug -o amber

    - name: Check every regex in generated code against Mica's dialect
      env:
        CRYSTAL: crystal
      run: scripts/check_generated_code_regex_on_mica.sh ./amber "$RUNNER_TEMP/generated-code-regex"

  # Separate job for additional platform-specific tests
  platform-specific:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    
    name: Platform-specific tests on ${{ matrix.os }}
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Refresh apt package index
      # install-crystal runs apt-get install without an update, so a stale
      # runner image index 404s on superseded packages.
      if: runner.os == 'Linux'
      run: sudo apt-get update

    - name: Install Crystal
      uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
      with:
        crystal: latest

    - name: Restore tested shard cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/shards
        key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
        restore-keys: |
          ${{ runner.os }}-shards-

    - name: Build pinned Minecart
      run: scripts/install_pinned_minecart.sh

    - name: Install dependencies
      run: minecart install --frozen --skip-ai-docs

    - name: Test CLI functionality
      run: |
        crystal build src/amber_cli.cr -o amber_cli
        ./amber_cli --help || true
        ./amber_cli --version || true

    - name: Test LSP functionality
      run: |
        crystal build src/amber_lsp.cr -o amber_lsp
        test -x ./amber_lsp

  # Job to run integration tests
  integration:
    runs-on: ubuntu-24.04
    name: Integration tests
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Refresh apt package index
      # install-crystal runs apt-get install without an update, so a stale
      # runner image index 404s on superseded packages.
      if: runner.os == 'Linux'
      run: sudo apt-get update

    - name: Install Crystal
      uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
      with:
        crystal: latest

    - name: Build pinned Minecart
      run: scripts/install_pinned_minecart.sh

    - name: Install dependencies
      run: minecart install --frozen --skip-ai-docs

    - name: Run integration tests
      run: |
        if [ -d "spec/integration" ]; then
          crystal spec spec/integration/
        else
          echo "No integration tests found, skipping..."
        fi 

  # The app `amber new` generates (SQLite, Grant, asset_pipeline) links no
  # regex engine, before and after a scaffold adds a Grant model. The stock
  # tarballs link PCRE2 statically, so the check reads symbols as well as
  # libraries, and a control program that uses Regex must show them.
  generated-app-linkage:
    name: Generated app links no PCRE2 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            crystal_version: 1.22.2
            crystal_tarball: crystal-1.22.2-1-linux-x86_64-bundled.tar.gz
            crystal_sha256: 0dc5c3ff1b5710c3981e207a6241fc06cc28fadb6622d5fdb21999adf1ca2309
          - os: macos-15
            crystal_version: 1.22.2
            crystal_tarball: crystal-1.22.2-1-darwin-universal.tar.gz
            crystal_sha256: 9c73ddd00aa8c9bf9f8fdc5aebdde99a92a63c2e2539b8ad5f9b8a27813ddc6f

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Install the generated app's system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libyaml-dev libssl-dev libgmp-dev zlib1g-dev

    - name: Install the generated app's system libraries (macOS)
      if: runner.os == 'macOS'
      run: brew install libyaml gmp

    - name: Install Crystal ${{ matrix.crystal_version }} (sha256-verified)
      env:
        CRYSTAL_TARBALL: ${{ matrix.crystal_tarball }}
        CRYSTAL_SHA256: ${{ matrix.crystal_sha256 }}
        CRYSTAL_VERSION: ${{ matrix.crystal_version }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/$CRYSTAL_TARBALL"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/crystal-lang/crystal/releases/download/$CRYSTAL_VERSION/$CRYSTAL_TARBALL"
        echo "$CRYSTAL_SHA256  $archive" | shasum -a 256 -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        crystal_root="$RUNNER_TEMP/crystal-$CRYSTAL_VERSION-1"
        # The macOS tarball keeps shards only in embedded/bin, and Minecart runs shards
        # for postinstall scripts. Each GITHUB_PATH line goes in front, so bin/ wins.
        if [[ -d "$crystal_root/embedded/bin" ]]; then
          echo "$crystal_root/embedded/bin" >> "$GITHUB_PATH"
        fi
        echo "$crystal_root/bin" >> "$GITHUB_PATH"

    - name: Build pinned Minecart
      run: scripts/install_pinned_minecart.sh

    - name: Install dependencies
      run: minecart install --frozen --skip-ai-docs

    - name: Compile CLI
      run: crystal build src/amber_cli.cr --no-debug -o amber

    - name: Check what the generated app links
      run: scripts/check_generated_app_linkage.sh ./amber "$RUNNER_TEMP/generated-app-linkage"
