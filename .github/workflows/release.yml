name: Build and Release Binaries

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            crystal_arch: aarch64
          - target: linux-x86_64
            os: ubuntu-latest
            crystal_arch: x86_64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            crystal_arch: aarch64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

    - name: Install Crystal (Linux)
      if: startsWith(matrix.target, 'linux-')
      uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
      with:
        crystal: latest

    - name: Install Crystal and OpenSSL (macOS)
      if: matrix.target == 'darwin-arm64'
      run: brew install crystal openssl@3

    - name: Verify release versions agree
      run: |
        shard_version="$(awk '/^version:/ { print $2; exit }' shard.yml)"
        cli_version="$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/amber_cli.cr | head -1)"
        test "$shard_version" = "$cli_version"
        requested_ref="${{ github.event.release.tag_name || github.event.inputs.ref }}"
        if [[ "$requested_ref" == v* ]]; then
          test "v$shard_version" = "$requested_ref"
        fi
    
    - name: Install dependencies
      run: |
        if [ -f shard.lock ]; then
          shards install --production
        else
          shards install
        fi
    
    - name: Build binaries (Linux)
      if: startsWith(matrix.target, 'linux-')
      run: |
        crystal build src/amber_cli.cr -o amber --release --static
        crystal build src/amber_lsp.cr -o amber-lsp --release --static

    - name: Build binaries (macOS ARM64)
      if: matrix.target == 'darwin-arm64'
      run: |
        crystal build src/amber_cli.cr -o amber --release
        crystal build src/amber_lsp.cr -o amber-lsp --release

    - name: Verify binaries
      run: |
        file amber
        ./amber --version
        file amber-lsp
        test -x amber-lsp

    - name: Reject retired OpenSSL linkage (macOS)
      if: matrix.target == 'darwin-arm64'
      run: |
        otool -L amber
        otool -L amber-lsp
        ! otool -L amber amber-lsp | grep -F 'openssl@1.1'

    - name: Smoke test generated Amber V2 web app
      run: scripts/smoke_generated_web.sh ./amber

    - name: Create archive
      run: |
        mkdir -p dist
        tar -czf dist/amber_cli-${{ matrix.target }}.tar.gz amber amber-lsp
        
    - name: Calculate checksum
      id: checksum
      run: |
        cd dist
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum amber_cli-${{ matrix.target }}.tar.gz > amber_cli-${{ matrix.target }}.tar.gz.sha256
        else
          shasum -a 256 amber_cli-${{ matrix.target }}.tar.gz > amber_cli-${{ matrix.target }}.tar.gz.sha256
        fi
        echo "sha256=$(cat amber_cli-${{ matrix.target }}.tar.gz.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        
    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: amber_cli-${{ matrix.target }}
        path: |
          dist/amber_cli-${{ matrix.target }}.tar.gz
          dist/amber_cli-${{ matrix.target }}.tar.gz.sha256
          
  upload-assets:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts
        
    - name: Verify artifacts exist
      run: |
        set -e
        for f in \
          artifacts/amber_cli-darwin-arm64/amber_cli-darwin-arm64.tar.gz \
          artifacts/amber_cli-darwin-arm64/amber_cli-darwin-arm64.tar.gz.sha256 \
          artifacts/amber_cli-linux-x86_64/amber_cli-linux-x86_64.tar.gz \
          artifacts/amber_cli-linux-x86_64/amber_cli-linux-x86_64.tar.gz.sha256 \
          artifacts/amber_cli-linux-arm64/amber_cli-linux-arm64.tar.gz \
          artifacts/amber_cli-linux-arm64/amber_cli-linux-arm64.tar.gz.sha256; do
          if [ ! -f "$f" ]; then
            echo "ERROR: expected file not found: $f"
            echo "Artifact tree:"
            find artifacts -type f | sort
            exit 1
          fi
          echo "OK: $f"
        done

    - name: Upload release assets
      uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
      with:
        files: |
          artifacts/amber_cli-darwin-arm64/amber_cli-darwin-arm64.tar.gz
          artifacts/amber_cli-darwin-arm64/amber_cli-darwin-arm64.tar.gz.sha256
          artifacts/amber_cli-linux-x86_64/amber_cli-linux-x86_64.tar.gz
          artifacts/amber_cli-linux-x86_64/amber_cli-linux-x86_64.tar.gz.sha256
          artifacts/amber_cli-linux-arm64/amber_cli-linux-arm64.tar.gz
          artifacts/amber_cli-linux-arm64/amber_cli-linux-arm64.tar.gz.sha256
        tag_name: ${{ github.event.release.tag_name }}
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  notify-homebrew:
    name: Notify Homebrew Tap
    needs: upload-assets
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - name: Dispatch to underscore tap (homebrew-amber_cli)
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
      with:
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        repository: amberframework/homebrew-amber_cli
        event-type: release-published
        client-payload: '{"version": "${{ github.event.release.tag_name }}"}'

    - name: Dispatch to hyphen tap (homebrew-amber-cli)
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
      with:
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        repository: amberframework/homebrew-amber-cli
        event-type: release-published
        client-payload: '{"version": "${{ github.event.release.tag_name }}"}'
