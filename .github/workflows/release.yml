name: Build and Release Binaries

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-26
            runner_arch: arm64
          - target: linux-x86_64
            os: ubuntu-24.04
            runner_arch: x86_64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            runner_arch: aarch64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

    - name: Verify runner architecture
      run: |
        actual_arch="$(uname -m)"
        expected_arch="${{ matrix.runner_arch }}"
        if [[ "$actual_arch" != "$expected_arch" ]]; then
          printf 'Runner architecture mismatch: expected %s, got %s\n' "$expected_arch" "$actual_arch" >&2
          exit 1
        fi
        printf 'Verified runner architecture: %s\n' "$actual_arch"

    - name: Install hash-verified Crystal
      run: scripts/install_pinned_crystal.sh "${{ matrix.target }}"

    - name: Verify release versions agree
      run: |
        shard_version="$(awk '/^version:/ { print $2; exit }' shard.yml)"
        cli_version="$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/amber_cli.cr | head -1)"
        test "$shard_version" = "$cli_version"
        requested_ref="${{ github.event.release.tag_name || github.event.inputs.ref }}"
        if [[ "$requested_ref" == v* ]]; then
          test "v$shard_version" = "$requested_ref"
        fi
    
    - name: Build pinned Minecart
      run: scripts/install_pinned_minecart.sh
      env:
        CRYSTAL: crystal-alpha

    - name: Install dependencies
      run: minecart install --production --skip-ai-docs
    
    - name: Build binaries (Linux)
      if: startsWith(matrix.target, 'linux-')
      run: |
        crystal-alpha build src/amber_cli.cr -o amber --release --static
        crystal-alpha build src/amber_lsp.cr -o amber-lsp --release --static

    - name: Build binaries (macOS ARM64)
      if: matrix.target == 'darwin-arm64'
      run: |
        crystal-alpha build src/amber_cli.cr -o amber --release
        crystal-alpha build src/amber_lsp.cr -o amber-lsp --release

    - name: Verify binaries
      run: |
        file amber
        ./amber --version
        file amber-lsp
        test -x amber-lsp

    - name: Reject retired OpenSSL linkage (macOS)
      if: matrix.target == 'darwin-arm64'
      run: |
        otool -L amber
        otool -L amber-lsp
        ! otool -L amber amber-lsp | grep -F 'openssl@1.1'

    - name: Smoke test generated Amber V2 web app
      run: scripts/smoke_generated_web.sh ./amber

    - name: Create archive
      run: |
        mkdir -p dist
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum amber amber-lsp > dist/checksums.txt
        else
          shasum -a 256 amber amber-lsp > dist/checksums.txt
        fi
        tar -czf dist/amber_cli-${{ matrix.target }}.tar.gz amber amber-lsp -C dist checksums.txt
        mkdir -p dist/verify
        tar -xzf dist/amber_cli-${{ matrix.target }}.tar.gz -C dist/verify
        if command -v sha256sum >/dev/null 2>&1; then
          (cd dist/verify && sha256sum --check checksums.txt)
        else
          (cd dist/verify && shasum -a 256 -c checksums.txt)
        fi
        
    - name: Calculate checksum
      id: checksum
      run: |
        cd dist
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum amber_cli-${{ matrix.target }}.tar.gz > amber_cli-${{ matrix.target }}.tar.gz.sha256
        else
          shasum -a 256 amber_cli-${{ matrix.target }}.tar.gz > amber_cli-${{ matrix.target }}.tar.gz.sha256
        fi
        echo "sha256=$(cat amber_cli-${{ matrix.target }}.tar.gz.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        
    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: amber_cli-${{ matrix.target }}
        path: |
          dist/amber_cli-${{ matrix.target }}.tar.gz
          dist/amber_cli-${{ matrix.target }}.tar.gz.sha256
          
  package-source:
    name: Package checksummed source archive
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

    - name: Verify release version
      run: |
        version="$(awk '/^version:/ { print $2; exit }' shard.yml)"
        requested_ref="${{ github.event.release.tag_name || github.event.inputs.ref }}"
        if [[ "$requested_ref" == v* ]]; then
          test "v$version" = "$requested_ref"
        fi

    - name: Create checksummed source archive
      run: |
        version="$(awk '/^version:/ { print $2; exit }' shard.yml)"
        mkdir -p dist
        git archive --format=tar.gz --prefix="amber_cli-${version}/" HEAD > "dist/amber_cli-source-${version}.tar.gz"
        cd dist
        sha256sum "amber_cli-source-${version}.tar.gz" > "amber_cli-source-${version}.tar.gz.sha256"
        printf 'CI source archive SHA-256: %s\n' "$(cut -d' ' -f1 < "amber_cli-source-${version}.tar.gz.sha256")"

    - name: Upload source archive for preflight and release
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: amber_cli-source
        path: |
          dist/amber_cli-source-*.tar.gz
          dist/amber_cli-source-*.tar.gz.sha256

  upload-assets:
    name: Upload Release Assets
    needs: [build, package-source]
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'

    steps:
    - name: Checkout release source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts
        
    - name: Verify artifacts exist
      run: |
        set -euo pipefail
        version="$(sed -n 's/^version: *//p' shard.yml | head -1)"
        for f in \
          "artifacts/amber_cli-source/amber_cli-source-${version}.tar.gz" \
          "artifacts/amber_cli-source/amber_cli-source-${version}.tar.gz.sha256" \
          artifacts/amber_cli-darwin-arm64/amber_cli-darwin-arm64.tar.gz \
          artifacts/amber_cli-darwin-arm64/amber_cli-darwin-arm64.tar.gz.sha256 \
          artifacts/amber_cli-linux-x86_64/amber_cli-linux-x86_64.tar.gz \
          artifacts/amber_cli-linux-x86_64/amber_cli-linux-x86_64.tar.gz.sha256 \
          artifacts/amber_cli-linux-arm64/amber_cli-linux-arm64.tar.gz \
          artifacts/amber_cli-linux-arm64/amber_cli-linux-arm64.tar.gz.sha256; do
          if [ ! -f "$f" ]; then
            echo "ERROR: expected file not found: $f"
            echo "Artifact tree:"
            find artifacts -type f | sort
            exit 1
          fi
          echo "OK: $f"
        done

    - name: Verify archive hashes and write release notes
      run: |
        set -euo pipefail
        version="$(sed -n 's/^version: *//p' shard.yml | head -1)"
        commit_hash="$(git rev-parse HEAD)"
        source_archive="amber_cli-source-${version}.tar.gz"
        source_checksum_file="artifacts/amber_cli-source/${source_archive}.sha256"
        (cd artifacts/amber_cli-source && sha256sum --check "${source_archive}.sha256")
        mkdir -p dist
        {
          printf "# Amber CLI v%s\n\n" "$version"
          printf "Release commit: \`%s\`\n\n" "$commit_hash"
          printf "Archive SHA-256 values:\n\n"
          printf "| Archive | SHA-256 |\n|---|---|\n"
          printf "| \`%s\` | \`%s\` |\n" "$source_archive" "$(cut -d' ' -f1 < "$source_checksum_file")"
          for target in darwin-arm64 linux-x86_64 linux-arm64; do
            archive="amber_cli-${target}.tar.gz"
            checksum_file="artifacts/amber_cli-${target}/${archive}.sha256"
            (cd "artifacts/amber_cli-${target}" && sha256sum --check "${archive}.sha256")
            printf "| \`%s\` | \`%s\` |\n" "$archive" "$(cut -d' ' -f1 < "$checksum_file")"
          done
        } > dist/release-notes.md
        cat dist/release-notes.md

    - name: Upload release assets
      uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
      with:
        files: |
          artifacts/amber_cli-darwin-arm64/amber_cli-darwin-arm64.tar.gz
          artifacts/amber_cli-darwin-arm64/amber_cli-darwin-arm64.tar.gz.sha256
          artifacts/amber_cli-linux-x86_64/amber_cli-linux-x86_64.tar.gz
          artifacts/amber_cli-linux-x86_64/amber_cli-linux-x86_64.tar.gz.sha256
          artifacts/amber_cli-linux-arm64/amber_cli-linux-arm64.tar.gz
          artifacts/amber_cli-linux-arm64/amber_cli-linux-arm64.tar.gz.sha256
          artifacts/amber_cli-source/amber_cli-source-*.tar.gz
          artifacts/amber_cli-source/amber_cli-source-*.tar.gz.sha256
        tag_name: ${{ github.event.release.tag_name }}
        fail_on_unmatched_files: true
        body_path: dist/release-notes.md
        append_body: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
